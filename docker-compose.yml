version: '3.8'

services:
  web:
    build: .
    # Restart if it crashes for any reason
    restart: always
    # Run migrations AND start the server
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_DOCKER=1
    depends_on:
      db:
        condition: service_healthy  # <--- MAGIC FIX: Wait for DB to be healthy

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=ratemysetup
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    # Define what "Healthy" means for the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: