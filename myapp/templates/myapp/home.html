<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateMySetup - Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .setup-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .setup-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .setup-img {
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="#">🖥️ RateMySetup</a>
            <div class="d-flex">
                <a href="/admin/" class="btn btn-outline-light btn-sm me-2">Admin Panel</a>
                <a href="/api/" class="btn btn-primary btn-sm">API Root</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">Setup Gallery Obuda</h1>
            <p class="lead text-muted">Real-time setups fetched from our secure REST API.</p>
        </div>

        <div class="row g-4" id="setup-container">
            <div class="text-center" id="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/setups/';

        fetch(API_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('setup-container');
                const loading = document.getElementById('loading');
                
                loading.style.display = 'none';

                if (data.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center"><p>No setups found. Create one in the Admin panel!</p></div>';
                    return;
                }

                data.forEach(setup => {
                    const imageUrl = setup.image ? setup.image : 'https://placehold.co/600x400?text=No+Image';
                    
                    const cardHtml = `
                        <div class="col-md-4">
                            <div class="card setup-card border-0 shadow-sm">
                                <img src="${imageUrl}" class="card-img-top setup-img" alt="${setup.title}">
                                <div class="card-body">
                                    <h5 class="card-title fw-bold">${setup.title}</h5>
                                    <p class="card-text text-muted">${setup.description.substring(0, 100)}...</p>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <small class="text-muted">By User #${setup.user}</small>
                                        <span class="badge bg-success">Verified</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });
            })
            .catch(error => {
                console.error('Error fetching setups:', error);
                document.getElementById('setup-container').innerHTML = 
                    '<div class="alert alert-danger">Error loading data from API. Make sure the server is running.</div>';
            });
    </script>
</body>
</html>
